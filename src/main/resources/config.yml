# =========================================================
#  DreamMaintenance - Velocity config (TaraashMC)
#  /maintenance  likho -> clickable panel khulega, ek click mein sab kaam
#  Colours: #FFD23F = highlight, gray = normal, #FF5E5E = error/warning
# =========================================================

# Shadow under every message: "#000000" = black, "#00000080" = half see-through, "none" = off
text-shadow: "#000000"

# Maintenance ON hone par server list mein ye MOTD dikhega.
# Placeholders: <reason> = selected preset ka reason, <remaining> = timer ka bacha time
motd:
  line1: "               <white>★</white> <#FFD23F><bold>TARAASHMC</bold></#FFD23F> <dark_gray>»</dark_gray> <#FF5E5E><bold>MAINTENANCE</bold></#FF5E5E>"
  line2: "          <gray><reason></gray> <dark_gray>•</dark_gray> <#FFD23F><remaining></#FFD23F>"

# Player count ki jagah ye text dikhega (server list mein)
version-text: "<#FF5E5E>⚠ Maintenance"

# Player count pe mouse le jaane par ye lines dikhengi
hover-lines:
  - "<#FFD23F><bold>TARAASHMC</bold></#FFD23F> <dark_gray>»</dark_gray> <#FF5E5E>Maintenance</#FF5E5E>"
  - ""
  - "<gray>Reason:</gray> <white><reason></white>"
  - "<gray><remaining></gray>"
  - ""
  - "<gray>Discord:</gray> <#FFD23F>discord.gg/taraashmc</#FFD23F>"

# plugins/dreammaintenance/maintenance-icon.png (64x64) daaloge to wo icon dikhega
use-custom-icon: true

# <remaining> ka text: jab end-timer laga ho / na laga ho
remaining-format: "Back in <time>"
no-timer-text: "We'll be back soon!"

# One-click presets - /maintenance panel mein button ban jaate hain.
# Button dabate hi maintenance ON + MOTD mein ye reason aa jayega.
presets:
  update:
    display: "<aqua>Update</aqua>"
    reason: "A new update is on the way!"
  bugfix:
    display: "<#FFD23F>Bug Fix</#FFD23F>"
    reason: "We're fixing some bugs"
  event:
    display: "<light_purple>Event</light_purple>"
    reason: "Setting up a new event"
  restart:
    display: "<#FF5E5E>Restart</#FF5E5E>"
    reason: "The server is restarting"
  emergency:
    display: "<dark_red>Emergency</dark_red>"
    reason: "Emergency maintenance"
default-preset: update

# Maintenance ON hote hi online players (jinke paas bypass nahi) ko kick karna hai?
kick-online-players: true

# Per-server maintenance mein players ko yahan bheja jayega
fallback-server: lobby

# Timer start hone se pehle in seconds par broadcast hoga
countdown-broadcast-at: [600, 300, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]

# Panel ke timer buttons
panel-start-timers: [1m, 5m, 10m]
panel-end-timers: [30m, 1h, 2h]

messages:
  prefix: "<white>★</white> <#FFD23F><bold>TARAASHMC</bold></#FFD23F> <dark_gray>»</dark_gray> "
  # Kick / join-deny screen (prefix nahi lagta)
  kick-message: "<#FFD23F><bold>TARAASHMC</bold></#FFD23F>\n<#FF5E5E><bold>⚠ Server Maintenance</bold></#FF5E5E>\n\n<gray><reason></gray>\n<#FFD23F><remaining></#FFD23F>\n\n<gray>Discord:</gray> <#FFD23F>discord.gg/taraashmc</#FFD23F>"
  server-denied: "<#FFD23F><server></#FFD23F> <#FF5E5E>is under maintenance right now.</#FF5E5E>"
  enabled: "<#FF5E5E>Maintenance is now <bold>ON</bold>.</#FF5E5E> <gray>Reason:</gray> <white><reason></white>"
  disabled: "<green>Maintenance is now <bold>OFF</bold>. TaraashMC is open for everyone!</green>"
  already-enabled: "<gray>Maintenance is already ON.</gray>"
  already-disabled: "<gray>Maintenance is already OFF.</gray>"
  countdown: "<#FF5E5E>Maintenance starts in</#FF5E5E> <#FFD23F><time></#FFD23F><#FF5E5E>!</#FF5E5E> <gray>(<reason>)</gray>"
  start-timer-set: "<gray>Maintenance will start in</gray> <#FFD23F><time></#FFD23F><gray>.</gray>"
  end-timer-set: "<gray>Maintenance will turn off by itself in</gray> <#FFD23F><time></#FFD23F><gray>.</gray>"
  timers-aborted: "<gray>All timers cancelled.</gray>"
  reason-set: "<gray>Reason set:</gray> <white><reason></white>"
  unknown-preset: "<#FF5E5E>No preset called</#FF5E5E> <#FFD23F><preset></#FFD23F><#FF5E5E>.</#FF5E5E>"
  invalid-time: "<#FF5E5E>That's not a valid time. Examples: 30s, 5m, 1h30m</#FF5E5E>"
  whitelist-added: "<#FFD23F><player></#FFD23F> <gray>was added to the maintenance whitelist.</gray>"
  whitelist-removed: "<#FFD23F><player></#FFD23F> <gray>was removed from the maintenance whitelist.</gray>"
  whitelist-not-found: "<#FFD23F><player></#FFD23F> <#FF5E5E>isn't on the maintenance whitelist.</#FF5E5E>"
  whitelist-empty: "<gray>The maintenance whitelist is empty.</gray>"
  server-enabled: "<#FFD23F><server></#FFD23F> <gray>is now under maintenance.</gray>"
  server-disabled: "<#FFD23F><server></#FFD23F> <gray>is out of maintenance.</gray>"
  unknown-server: "<#FF5E5E>No server called</#FF5E5E> <#FFD23F><server></#FFD23F><#FF5E5E>.</#FF5E5E>"
  reloaded: "<green>Config reloaded.</green>"
